<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

<div class="container my-5">
  <h2 class="text-center mb-4">Employee Management System</h2>

  <div class="card mb-5 shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">নতুন এমপ্লয়ি যোগ করুন</h5>
    </div>
    <div class="card-body">
      <form id="addEmployeeForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">নাম *</label>
            <input type="text" id="addName" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">লিঙ্গ (Gender) *</label>
            <select id="addGender" class="form-select" required>
              <option value="">নির্বাচন করুন</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">পদবী (Designation)</label>
            <input type="text" id="addDesignation" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">যোগ্যতা (Qualification)</label>
            <input type="text" id="addQualification" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">বিষয় (Subject)</label>
            <input type="text" id="addSubject" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">মোবাইল নম্বর</label>
            <input type="number" id="addMobileNumber" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">জন্ম তারিখ</label>
            <input type="date" id="addDOB" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">যোগদানের তারিখ</label>
            <input type="date" id="addDOJ" class="form-control">
          </div>
        </div>
        <button type="submit" class="btn btn-success mt-3">সংরক্ষণ করুন</button>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0">এমপ্লয়ি তালিকা</h5>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>নাম</th>
              <th>পদবী</th>
              <th>বিষয়</th>
              <th>মোবাইল</th>
              <th>লিঙ্গ</th>
              <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody">
            </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title">তথ্য আপডেট করুন</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editEmployeeForm">
          <input type="hidden" id="editEmployeeId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">নাম *</label>
              <input type="text" id="editName" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">লিঙ্গ (Gender) *</label>
              <select id="editGender" class="form-select" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">পদবী</label>
              <input type="text" id="editDesignation" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">যোগ্যতা</label>
              <input type="text" id="editQualification" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">বিষয়</label>
              <input type="text" id="editSubject" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">মোবাইল নম্বর</label>
              <input type="number" id="editMobileNumber" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">জন্ম তারিখ</label>
              <input type="date" id="editDOB" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">যোগদানের তারিখ</label>
              <input type="date" id="editDOJ" class="form-control">
            </div>
          </div>
          <div class="modal-footer mt-4 pb-0 pe-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">বন্ধ করুন</button>
            <button type="submit" class="btn btn-primary">আপডেট করুন</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Initialize Supabase Client
  const SUPABASE_URL = 'https://kehcdmuiyiikewdxzwdj.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlaGNkbXVpeWlpa2V3ZHh6d2RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5OTU1ODQsImV4cCI6MjEwMzU3MTU4NH0.WT5vSe_4_ZacvAd1zz2zAuFB87D5zN7zeOMSQlkclwY';
  // ✅ সঠিক কোড
const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);


  const editModal = new bootstrap.Modal(document.getElementById('editModal'));

  // Fetch and display data
  async function fetchEmployees() {
    const { data, error } = await supabase.from('Employee').select('*').order('EmployeeID', { ascending: true });
    
    if (error) {
      console.error('Error fetching data:', error);
      return;
    }

    const tbody = document.getElementById('employeeTableBody');
    tbody.innerHTML = '';

    data.forEach(emp => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${emp.EmployeeID}</td>
        <td>${emp.EmployeeName}</td>
        <td>${emp.Designation || '-'}</td>
        <td>${emp.Subject || '-'}</td>
        <td>${emp.MobileNumber || '-'}</td>
        <td>${emp.Gender}</td>
        <td>
          <button class="btn btn-sm btn-warning" onclick="openEditModal(${emp.EmployeeID})">সম্পাদনা</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Insert Data
  document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      EmployeeName: document.getElementById('addName').value,
      Gender: document.getElementById('addGender').value,
      Designation: document.getElementById('addDesignation').value || null,
      Qualification: document.getElementById('addQualification').value || null,
      Subject: document.getElementById('addSubject').value || null,
      MobileNumber: document.getElementById('addMobileNumber').value ? parseInt(document.getElementById('addMobileNumber').value) : null,
      DateOfBirth: document.getElementById('addDOB').value || null,
      DateOfJoin: document.getElementById('addDOJ').value || null
    };

    const { error } = await supabase.from('Employee').insert([payload]);

    if (error) {
      alert('ডাটা যোগ করতে সমস্যা হয়েছে: ' + error.message);
    } else {
      document.getElementById('addEmployeeForm').reset();
      fetchEmployees();
    }
  });

  // Open Edit Modal with existing values
  async function openEditModal(id) {
    const { data, error } = await supabase.from('Employee').select('*').eq('EmployeeID', id).single();
    
    if (error) {
      alert('ডাটা আনতে সমস্যা হয়েছে');
      return;
    }

    document.getElementById('editEmployeeId').value = data.EmployeeID;
    document.getElementById('editName').value = data.EmployeeName;
    document.getElementById('editGender').value = data.Gender;
    document.getElementById('editDesignation').value = data.Designation || '';
    document.getElementById('editQualification').value = data.Qualification || '';
    document.getElementById('editSubject').value = data.Subject || '';
    document.getElementById('editMobileNumber').value = data.MobileNumber || '';
    document.getElementById('editDOB').value = data.DateOfBirth || '';
    document.getElementById('editDOJ').value = data.DateOfJoin || '';

    editModal.show();
  }

  // Update Data
  document.getElementById('editEmployeeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('editEmployeeId').value;

    const payload = {
      EmployeeName: document.getElementById('editName').value,
      Gender: document.getElementById('editGender').value,
      Designation: document.getElementById('editDesignation').value || null,
      Qualification: document.getElementById('editQualification').value || null,
      Subject: document.getElementById('editSubject').value || null,
      MobileNumber: document.getElementById('editMobileNumber').value ? parseInt(document.getElementById('editMobileNumber').value) : null,
      DateOfBirth: document.getElementById('editDOB').value || null,
      DateOfJoin: document.getElementById('editDOJ').value || null
    };

    const { error } = await supabase.from('Employee').update(payload).eq('EmployeeID', id);

    if (error) {
      alert('আপডেট করতে সমস্যা হয়েছে: ' + error.message);
    } else {
      editModal.hide();
      fetchEmployees();
    }
  });

  // Initial Load
  fetchEmployees();
</script>
</body>
</html>
